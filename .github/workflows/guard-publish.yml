# DO NOT EDIT — generated from src/blueprints/guard-publish.ts; run `panoptic-guard commit` to refresh
name: Guard publish

on:
  workflow_dispatch:
    inputs:
      sha:
        type: string
        description: 'Commit SHA to publish (passed by panoptic-guard release)'
        required: true
      version:
        type: string
        description: 'Release version vX.Y.Z (passed by panoptic-guard release)'
        required: false
      draft-ref:
        type: string
        description: 'Draft GitHub Release ref/tag staged by panoptic-release stage (passed by panoptic-guard release)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # `panoptic-release publish` fetches a draft-release asset and does
    # an `npm publish` + a draft→published flip; allow time for slow
    # registry round-trips while keeping a hard cap so absent-credentials
    # / network outages fail fast rather than running for hours.
    timeout-minutes: 15
    permissions:
      # `github.token` is scoped here to THIS repo's own namespace:
      #   contents: write  → flip draft Release → published + create the
      #                       vX.Y.Z tag (tag-at-publish, exactly once).
      #   packages: write  → `npm publish` the prebuilt, verified .tgz.
      # The cross-repo read PAT is gated to the install-tooling step
      # only — it is NOT available to the publish step (pg#705 §Token
      # Model REMOTE-mode).
      contents: write
      packages: write
    steps:
      # 1/5 — Provenance checkout ONLY. `panoptic-guard release`
      # dispatches this AFTER local validation produced a signed receipt
      # AND `panoptic-release stage` uploaded the publishable artifact
      # as a draft-release asset. This workflow does NOT re-validate
      # (CI is not a validator) and does NOT build the project under
      # release (no project install / no project build follow).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      # 2/5 — Fetch the validation notes ref into the runner's local
      # repo. `actions/checkout@v4` even at `fetch-depth: 0` does NOT
      # fetch `refs/notes/*` — git notes refs must be fetched
      # explicitly. Without this step, `panoptic-release publish`'s
      # `defaultReadReceiptNote` reader (`git notes
      # --ref=refs/notes/validation show HEAD`) finds nothing and
      # aborts with "no validation receipt found at
      # refs/notes/validation on HEAD — cannot hard-gate the artifact"
      # (pg#811). The signed receipt itself was produced locally by
      # `panoptic-guard release` before dispatch; this step only
      # materialises it on the runner so the publish hard-gate can read
      # it. This is NOT re-validation — no validator runs here.
      - name: Fetch validation notes
        run: git fetch origin 'refs/notes/validation:refs/notes/validation'

      # 3/5 — Node + scoped-registry auth for the install-tooling step.
      # `always-auth: true` makes the npm client send the
      # NODE_AUTH_TOKEN value with every request to the configured
      # registry; combined with `scope: '@ai-swfactory'` this scopes
      # auth to the @ai-swfactory namespace on npm.pkg.github.com only.
      # node-version 24 — Node 24 LTS (Active LTS since Oct 2025).
      # Pinned explicitly so the publish runner stays deterministic and
      # ahead of the GitHub Actions Node 20 deprecation (forced Node 24
      # for JS actions on 2026-06-02). See pg#791 / cf#704.
      - name: Set up Node for panoptic-release install
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@ai-swfactory'
          always-auth: true

      # 4/5 — Install the panoptic-release CLI globally on the runner.
      # This step uses the cross-repo read-only PAT
      # (`AI_SWFACTORY_PACKAGES_TOKEN`, `read:packages`) — scoped
      # exclusively to fetching this one tooling package from
      # npm.pkg.github.com. The PAT is NOT available to step 5/5 (the
      # publish step), which uses only `github.token`. Without this
      # step the publish step fails in ~5s with
      # `panoptic-release: command not found` (pg#705 — pg#656 actual
      # root cause).
      - name: Install panoptic-release tooling
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AI_SWFACTORY_PACKAGES_TOKEN }}
        run: npm install -g @ai-swfactory/panoptic-release@^6.0.0

      - name: Run panoptic-release publish
        env:
          # §Token Model REMOTE-mode (pg#705): the publish step gets
          # ONLY the ambient `github.token`, scoped by the job-level
          # `contents: write` + `packages: write` permissions to this
          # repo's own namespace. The cross-repo read/install PAT is
          # NOT set on this step — it was consumed exclusively by the
          # install-tooling step above. `NPM_TOKEN` and
          # `GITHUB_TOKEN` are env slots panoptic-release's credential
          # resolver reads; on the publish side BOTH carry
          # `github.token`, never the cross-repo PAT.
          NPM_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! panoptic-release publish; then
            echo "::error::panoptic-release publish failed inside the dispatched guard-publish.yml run (fetch / guard-SDK verifyArtifact hard-gate / npm publish / draft→published flip)."
            echo "::error::Re-run \`panoptic-guard release\` locally — that command actively waits on the dispatched workflow and surfaces failures with full local context."
            exit 1
          fi

      - name: Broadcast to ecosystem consumers
        continue-on-error: true
        env:
          # Disjoint from the install PAT and from `github.token`:
          # the broadcast token has write access to consumer repos to
          # open the version-bump PRs. Scoped to THIS step only.
          GITHUB_TOKEN: ${{ secrets.AI_SWFACTORY_BROADCAST_TOKEN }}
          AI_SWFACTORY_BROADCAST_TOKEN: ${{ secrets.AI_SWFACTORY_BROADCAST_TOKEN }}
        run: |
          if [ -f broadcast-consumers.json ]; then
            version="$(node -p "require('./package.json').version")"
            name="$(node -p "require('./package.json').name")"
            panoptic-release broadcast --package "$name" --version "$version" --consumers broadcast-consumers.json
          else
            echo "broadcast: no broadcast-consumers.json — skipping ecosystem broadcast"
          fi
