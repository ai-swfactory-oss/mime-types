name: Claude Factory release

on:
  workflow_dispatch: {}

concurrency:
  group: claude-factory-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Claude Factory release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      checks: read
      statuses: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@ai-swfactory'
          always-auth: true

      - name: Install claude-factory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AI_SWFACTORY_PACKAGES_TOKEN }}
        run: npm install -g @ai-swfactory/claude-factory@latest

      - name: Set the git identity of the release commits
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898283+github-actions[bot]@users.noreply.github.com'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_SWFACTORY_PACKAGES_TOKEN: ${{ secrets.AI_SWFACTORY_PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.AI_SWFACTORY_PACKAGES_TOKEN }}
        run: claude-factory work release --local
