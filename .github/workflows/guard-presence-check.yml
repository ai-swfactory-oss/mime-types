# DO NOT EDIT — generated from src/blueprints/guard-presence-check.ts; run `claude-factory work commit` to refresh
name: Guard presence check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  presence-check:
    runs-on: ubuntu-latest
    # CI verifies receipts; it does not produce them. Local-first contract:
    # the developer signs the receipt locally via `claude-factory work commit`
    # (or `claude-factory work finish` for release pushes) and pushes the
    # validation note alongside the commit. This workflow's only job is to
    # confirm that EVERY commit in the pushed range carries a complete
    # signed receipt on refs/notes/validation.
    #
    # Sub-minute budget — only git + node operations, both pre-installed
    # on ubuntu-latest.
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      # cf#854 — fetch full history so the PR base..head range is walkable.
      # The walker needs every commit in the range plus the base itself, and
      # the receipt notes ref (refs/notes/validation) is fetched explicitly
      # in the verify step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Internal-strict guard.json opt-out policy (issue #225 Stryker
      # opt-out + issue #506 blueprint-owned-file opt-out).
      #
      # The `guard.json` opt-outs (`validators.stryker.enabled: false`
      # and `blueprints.<id>.ownedFiles`) are EXTERNAL-consumer ramps.
      # They MUST NOT appear in the @ai-swfactory internal repos, which
      # hold 100% mutation coverage and zero sanctioned blueprint
      # divergence as permanent project invariants.
      #
      # ASYMMETRIC by design: this workflow is rendered into EVERY
      # consumer repo from the shared blueprint, so the gate is
      # self-host-scoped — it only enforces when the repo's
      # `package.json` "name" is in the `@ai-swfactory/` scope.
      # External consumers get the step but it is a no-op for them
      # (their opt-out is legitimate). Zero-install (git+node only) to
      # stay inside the sub-minute presence-check budget.
      - name: Internal-strict guard.json opt-out policy
        run: |
          if [ ! -f package.json ]; then
            echo "no package.json — internal-strict policy not applicable"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const name = (pkg && pkg.name) || '';
            if (!name.startsWith('@ai-swfactory/')) {
              console.log('not an @ai-swfactory repo (' + (name || '<unnamed>') + ') — opt-out is a legitimate external-consumer ramp; policy not applicable');
              process.exit(0);
            }
            if (!fs.existsSync('guard.json')) {
              console.log('@ai-swfactory repo with no guard.json — internal-strict policy satisfied');
              process.exit(0);
            }
            let cfg;
            try { cfg = JSON.parse(fs.readFileSync('guard.json', 'utf8')); }
            catch (e) { console.error('::error::guard.json is present but not valid JSON: ' + e.message); process.exit(1); }
            const stacks = (cfg && cfg.stacks) || {};
            const strykerOffenders = Object.entries(stacks)
              .filter(([, s]) => s && s.validators && s.validators.stryker && s.validators.stryker.enabled === false)
              .map(([id]) => id);
            const ownedFileOffenders = Object.entries(stacks).flatMap(([id, s]) => {
              const bps = (s && s.blueprints) || {};
              return Object.entries(bps)
                .filter(([, b]) => b && Array.isArray(b.ownedFiles) && b.ownedFiles.length > 0)
                .map(([bpId]) => id + '.' + bpId);
            });
            if (strykerOffenders.length > 0) {
              console.error('::error::Internal-strict policy violation: guard.json opts out of stryker for stack(s): ' + strykerOffenders.join(', '));
            }
            if (ownedFileOffenders.length > 0) {
              console.error('::error::Internal-strict policy violation: guard.json declares a blueprint-owned-file opt-out (issue #506) for: ' + ownedFileOffenders.join(', '));
            }
            if (strykerOffenders.length > 0 || ownedFileOffenders.length > 0) {
              console.error('::error::Internal @ai-swfactory projects MUST NOT use these opt-outs — they are external-consumer ramps only.');
              process.exit(1);
            }
            console.log('@ai-swfactory repo: guard.json present but declares no forbidden opt-out — internal-strict policy satisfied');
          "

      # cf#854 — per-commit receipt walker.
      #
      # For every commit in the pushed range we look up its direct note
      # on refs/notes/validation, parse the receipt JSON, and require:
      #   - status is "pass" OR "break-glass"
      #   - expectedValidators is non-empty
      #   - every id in expectedValidators is a key of validators
      #   - validators count equals expectedValidators count
      #
      # If a commit has NO direct note, the tree-hash fallback is allowed
      # only in the classic squash-merge case (push event to main, range
      # of exactly one commit, parent equals github.event.before). In
      # every other scenario (intermediate commit on a PR branch, force
      # push, etc.) the fallback is REFUSED and the gate fails fast with
      # an actionable ::error:: directing to `claude-factory work commit` /
      # `claude-factory work finish`.
      - name: Verify receipt presence
        run: |
          # Self-contained shell options: do NOT rely on GitHub Actions'
          # default 'bash -eo pipefail' injection. 'set -euo pipefail'
          # makes the script behaviour byte-identical whether invoked by
          # the runner, by the integration spec harness, or by a developer
          # debugging locally.
          set -euo pipefail
          # pg#880: `--refmap=` is MANDATORY — if a guard hook-install runs
          # before this fetch (e.g. a future workflow change), the configured
          # `remote.origin.fetch = +refs/notes/validation:refs/notes/validation`
          # refspec would piggyback and force-clobber the local ref. `--refmap=`
          # restricts this invocation to the explicit refspec only.
          git fetch --refmap= origin '+refs/notes/validation:refs/notes/validation' 2>/dev/null || true

          EVENT="${{ github.event_name }}"
          PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
          PUSH_BEFORE="${{ github.event.before }}"
          PUSH_AFTER="${{ github.event.after }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          # Compute the commit range to walk.
          RANGE=""
          if [ "$EVENT" = "pull_request" ]; then
            if [ -n "$PR_BASE_REF" ]; then
              git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" 2>/dev/null || true
            fi
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT" = "push" ]; then
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$ZERO_SHA" ]; then
              # Initial push to main — no prior tip, just verify the new
              # head. Using the bare SHA as RANGE would cause
              # `git rev-list --reverse <sha>` to enumerate the ENTIRE
              # ancestry, which contradicts the documented intent and
              # would reject any pre-existing history that lacks receipts
              # (cf#854 review finding 3). The signal we want is "one
              # commit: the new head". We emit a one-line synthetic SHA
              # list directly via `echo` instead of going through
              # `git rev-list`, sidestepping the
              # `<sha>~..<sha>` range form which fails on a true
              # single-commit fresh repo where `<sha>^` does not exist.
              RANGE="__INITIAL_PUSH__${PUSH_AFTER}"
            else
              RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          else
            echo "::error::Unsupported event type: $EVENT"
            exit 1
          fi

          # Enumerate commits oldest → newest. Special-case the
          # synthetic "__INITIAL_PUSH__<sha>" sentinel produced above:
          # bypass git rev-list (which would walk ancestry) and emit the
          # single head SHA directly. This is the documented "just verify
          # the new head" path for the initial push to main.
          case "$RANGE" in
            __INITIAL_PUSH__*)
              SHAS="${RANGE#__INITIAL_PUSH__}"
              ;;
            *)
              SHAS=$(git rev-list --reverse "$RANGE" 2>/dev/null || echo '')
              ;;
          esac
          if [ -z "$SHAS" ]; then
            echo "No commits in range $RANGE — nothing to verify."
            exit 0
          fi

          COMMIT_COUNT=$(printf '%s\n' "$SHAS" | wc -l | tr -d ' ')

          # Decide whether the tree-hash fallback is allowed for THIS run.
          # It is allowed ONLY for a classic squash-merge to main:
          #   (a) push event (not pull_request)
          #   (b) range contains exactly one commit
          #   (c) commit's first parent equals github.event.before
          FALLBACK_ALLOWED="no"
          if [ "$EVENT" = "push" ] && [ "$COMMIT_COUNT" = "1" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ]; then
            ONLY_SHA=$(printf '%s' "$SHAS")
            PARENT_SHA=$(git rev-parse "${ONLY_SHA}^" 2>/dev/null || echo '')
            if [ "$PARENT_SHA" = "$PUSH_BEFORE" ]; then
              FALLBACK_ALLOWED="yes"
            fi
          fi

          # Walk every commit. Fail-fast on the first bad commit but keep
          # the loop structure tight so future extensions (e.g. emitting a
          # run-summary finding per commit) drop in cleanly. A pipe (rather
          # than a heredoc) avoids YAML-block indentation problems — the
          # terminator-at-column-0 constraint of bash heredocs would be
          # brittle inside a YAML `run: |` scalar.
          printf '%s\n' "$SHAS" | while IFS= read -r SHA; do
            [ -z "$SHA" ] && continue
            SUBJECT=$(git log -1 --pretty=%s "$SHA" 2>/dev/null || echo '<unknown>')
            NOTE=$(git notes --ref=validation show "$SHA" 2>/dev/null || echo '')
            RESULT=""
            if [ -n "$NOTE" ]; then
              RESULT=$(printf '%s' "$NOTE" | node -e "
            const d = require('fs').readFileSync(0, 'utf8');
            try {
              const r = JSON.parse(d);
              const ok = r.status === 'pass' || r.status === 'break-glass';
              if (!ok) { console.log('fail:status'); process.exit(0); }
              const expected = Array.isArray(r.expectedValidators) ? r.expectedValidators : [];
              if (expected.length === 0) { console.log('fail:empty-validators'); process.exit(0); }
              const validators = r.validators || {};
              const keys = Object.keys(validators);
              if (keys.length !== expected.length) { console.log('fail:incomplete'); process.exit(0); }
              for (const id of expected) {
                if (typeof id !== 'string' || !(id in validators)) { console.log('fail:incomplete'); process.exit(0); }
              }
              console.log('pass');
            } catch { console.log('fail:corrupt'); }
              ")
            else
              if [ "$FALLBACK_ALLOWED" = "yes" ]; then
                HEAD_TREE=$(git rev-parse "${SHA}^{tree}" 2>/dev/null || echo '')
                FALLBACK_NOTE=""
                if [ -n "$HEAD_TREE" ]; then
                  FALLBACK_NOTE=$(git notes --ref=validation list 2>/dev/null | while read -r _NOTE_SHA ANNOTATED_SHA; do
                    [ -z "$ANNOTATED_SHA" ] && continue
                    CANDIDATE=$(git notes --ref=validation show "$ANNOTATED_SHA" 2>/dev/null || echo '')
                    [ -z "$CANDIDATE" ] && continue
                    CANDIDATE_TREE=$(printf '%s' "$CANDIDATE" | node -e "const d=require('fs').readFileSync(0,'utf8'); try { const r=JSON.parse(d); console.log(r.treeHash||''); } catch { console.log(''); }")
                    if [ "$CANDIDATE_TREE" = "$HEAD_TREE" ]; then
                      printf '%s' "$CANDIDATE"
                      break
                    fi
                  done)
                fi
                if [ -n "$FALLBACK_NOTE" ]; then
                  echo "commit $SHA: receipt recovered via tree-hash fallback (squash-merge case — sanctioned by cf#854 fallback policy)."
                  RESULT=$(printf '%s' "$FALLBACK_NOTE" | node -e "
            const d = require('fs').readFileSync(0, 'utf8');
            try {
              const r = JSON.parse(d);
              const ok = r.status === 'pass' || r.status === 'break-glass';
              if (!ok) { console.log('fail:status'); process.exit(0); }
              const expected = Array.isArray(r.expectedValidators) ? r.expectedValidators : [];
              if (expected.length === 0) { console.log('fail:empty-validators'); process.exit(0); }
              const validators = r.validators || {};
              const keys = Object.keys(validators);
              if (keys.length !== expected.length) { console.log('fail:incomplete'); process.exit(0); }
              for (const id of expected) {
                if (typeof id !== 'string' || !(id in validators)) { console.log('fail:incomplete'); process.exit(0); }
              }
              console.log('pass');
            } catch { console.log('fail:corrupt'); }
                  ")
                else
                  RESULT="fail:missing-note"
                fi
              else
                RESULT="fail:missing-note"
              fi
            fi

            case "$RESULT" in
              pass)
                echo "commit $SHA \"$SUBJECT\": ok"
                ;;
              fail:missing-note)
                echo "::error::commit $SHA \"$SUBJECT\": no validation receipt on refs/notes/validation (tree-hash fallback is not allowed for intermediate commits on a PR branch — cf#854)."
                echo "::error::CI verifies receipts; it does not produce them. Run \`claude-factory work commit --message \"<your-message>\"\` (or \`claude-factory work finish\` for release pushes) locally — those commands sign and push the receipt alongside the commit."
                exit 1
                ;;
              fail:status)
                echo "::error::commit $SHA \"$SUBJECT\": validation receipt has status not in {pass, break-glass}."
                echo "::error::Re-run \`claude-factory work commit --message \"<your-message>\"\` (or \`claude-factory work finish\`) locally — those commands rerun validators and refresh the signed receipt."
                exit 1
                ;;
              fail:incomplete)
                echo "::error::commit $SHA \"$SUBJECT\": validation receipt is incomplete (missing one or more expected validators)."
                echo "::error::Re-run \`claude-factory work commit --message \"<your-message>\"\` (or \`claude-factory work finish\`) locally to produce a complete signed receipt."
                exit 1
                ;;
              fail:corrupt)
                echo "::error::commit $SHA \"$SUBJECT\": validation receipt failed to parse as JSON."
                echo "::error::Re-run \`claude-factory work commit --message \"<your-message>\"\` (or \`claude-factory work finish\`) locally to produce a fresh signed receipt."
                exit 1
                ;;
              fail:empty-validators)
                echo "::error::commit $SHA \"$SUBJECT\": validation receipt has an empty \`expectedValidators\` list (no validators were declared at receipt-write time). CI rejects this as a trust-boundary violation — a guard-managed project must declare at least one validator."
                echo "::error::Re-run \`claude-factory work commit --message \"<your-message>\"\` (or \`claude-factory work finish\`) locally to produce a complete signed receipt with a non-empty \`expectedValidators\` list."
                exit 1
                ;;
              *)
                echo "::error::commit $SHA \"$SUBJECT\": unexpected receipt verification result: $RESULT"
                echo "::error::A result in this shape is not what a completed guard run reports. Either guard was interrupted or hit an orchestration bug — file an issue with the receipt dump above; or the commit reached the remote without a guard run signing it (SKIP_GUARD / --no-verify / a direct push). Re-run \`claude-factory work commit --message \"<your-message>\"\` (or \`claude-factory work finish\`) to re-validate and sign. Do not skip guard."
                exit 1
                ;;
            esac
          done
          # The pipe above runs the loop in a subshell. If any iteration
          # `exit 1`s, the subshell exit propagates here via PIPESTATUS.
          PIPE_STATUS=${PIPESTATUS[1]:-0}
          if [ "$PIPE_STATUS" != "0" ]; then
            echo "::error::Per-commit receipt walker failed (one or more commits in range $RANGE)."
            exit 1
          fi
          echo "All $COMMIT_COUNT commit(s) in range $RANGE carry complete signed receipts."
